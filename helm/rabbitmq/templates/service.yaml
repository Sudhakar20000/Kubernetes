
apiVersion: v1
kind: Service
metadata:
  name: headless-rabbitmq
  namespace: flipkart
  labels:
    project: flipkart
    tier: db
    component: rabbitmq
spec:
  clusterIP: None
  selector:
    project: flipkart
    tier: db
    component: rabbitmq
  ports:
    - protocol: TCP
      port: 5672 # service port
      targetPort: 5672 # container port
---
