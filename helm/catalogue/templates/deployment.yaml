apiVersion: apps/v1
kind: Deployment
metadata:
  name: catalogue
  namespace: flipkart
  # labels related to deployment resource
  labels:
    project: flipkart
    tier: backend
    component: catalogue
spec:
  replicas: {{ .Values.deployment.replicas }}
  selector:
    matchLabels:
      project: flipkart
      tier: backend
      component: catalogue
  # Pod
  template:
    metadata:
      labels:
        project: flipkart
        tier: backend
        component: catalogue
    spec:
      containers:
      - name: catalogue
        image: "{{ .Values.deployment.imageRepo }}:{{ .Values.deployment.imageVersion}}"
        resources:
          requests:
            cpu: "100m"
            memory: "128Mi"
          limits:
            cpu: "100m"
            memory: "128Mi"
        envFrom:
        - configMapRef:
            name: catalogue