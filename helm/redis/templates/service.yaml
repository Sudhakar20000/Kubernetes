apiVersion: v1
kind: Service
metadata:
  name: headless-redis
  namespace: flipkart
  labels:
    project: flipkart
    tier: db
    component: redis
spec:
  clusterIP: None
  selector:
    project: flipkart
    tier: db
    component: redis
  ports:
  - protocol: TCP
    port: 6379
    targetPort: 6379
