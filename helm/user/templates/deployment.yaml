apiVersion: apps/v1
kind: Deployment
metadata:
  name: user
  namespace: flipkart
  labels:
    project: flipkart
    tier: backend
    component: user
spec:
  replicas: {{ .Values.deployment.replicas }}
  selector:
    matchLabels:
      project: flipkart
      tier: backend
      component: user
  template:
    metadata:
      labels:
        project: flipkart
        tier: backend
        component: user
    spec:
      containers:
      - name: user
        image: "{{ .Values.deployment.imageRepo }}:{{ .Values.deployment.imageVersion}}"
        envFrom:
        - configMapRef:
            name: user
        ports:
        - containerPort: 8080
        resources:
          requests:
            cpu: "100m"
            memory: "128Mi"
          limits:
            cpu: "100m"
            memory: "128Mi"