apiVersion: v1
kind: Service
metadata: 
  name: headless-mysql
  namespace: flipkart
  labels:
    project: flipkart
    tier: db
    component: mysql
spec:
  clusterIP: None
  selector:
    project: flipkart
    tier: db
    component: mysql
  ports:
  - protocol: TCP
    port: 3306
    targetPort: 3306
---
apiVersion: v1
kind: Service
metadata:
  name: mysql
  namespace: flipkart
  labels:
    project: flipkart
    tier: db
    component: mysql
spec:
  selector:
    project: flipkart
    tier: db
    component: mysql
  ports:
    - protocol: TCP
      port: 3306 # service port
      targetPort: 3306 # container port