apiVersion: apps/v1
kind: Deployment
metadata:
  name: app2
  namespace: flipkart
spec:
  replicas: 2
  selector:
    matchLabels:
      app: app2
  template:
    metadata:
      labels:
        app: app2
    spec:
      containers:
      - name: app2
        image: sudhakar20000/app2
        ports:
        - containerPort: 80
---
apiVersion: v1
kind: Service
metadata:
  name: app2
  namespace: flipkart
spec:
  selector:
    app: app2
  ports:
  - port: 80
    targetPort: 80
---